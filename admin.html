<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="admin-header">
    <a class="home-link" href="index.html">← Back to Home</a>
    <h1>Admin Dashboard</h1>
    <button id="admin-logout" class="logout-btn">Logout</button>
  </header>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <nav>
        <ul>
          <li class="active" data-section="overview">Overview</li>
          <li data-section="orders">Orders</li>
          <li data-section="users">Users</li>
          <li data-section="settings">Settings</li>
        </ul>
      </nav>
    </aside>
    <main class="admin-main">
      <section id="overview" class="admin-section active">
        <div class="metrics">
          <div class="card"><h3 id="metric-orders">0</h3><p>Total Orders</p></div>
          <div class="card"><h3 id="metric-users">0</h3><p>Active Users</p></div>
          <div class="card"><h3 id="metric-revenue">TSh 0</h3><p>Revenue</p></div>
        </div>
        <section class="recent">
          <h2>Recent Orders</h2>
          <table id="orders-table">
            <thead><tr><th>ID</th><th>User</th><th>Items</th><th>Total</th><th>Status</th></tr></thead>
            <tbody></tbody>
          </table>
        </section>
      </section>

      <section id="orders" class="admin-section">
        <h2>All Orders</h2>
        <table id="all-orders-table">
          <thead><tr><th>Order ID</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Date</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>

      <section id="users" class="admin-section">
        <h2>Users</h2>
        <table id="users-table">
          <thead><tr><th>Username</th><th>Role</th><th>Actions</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>

      <section id="settings" class="admin-section">
        <h2>Store Settings</h2>
        <form id="settings-form" class="settings-form">
          <div class="form-group">
            <label>Store Name</label>
            <input type="text" id="store-name" value="Swahili Food Ordering">
          </div>
          <div class="form-group">
            <label>Delivery Fee (TSh)</label>
            <input type="number" id="delivery-fee" value="2500" step="0.01">
          </div>
          <div class="form-group">
            <label>Opening Hours</label>
            <input type="time" id="opening-hours" value="09:00">
          </div>
          <div class="form-group">
            <label>Closing Hours</label>
            <input type="time" id="closing-hours" value="22:00">
          </div>
          <button type="submit" class="save-btn">Save Settings</button>
          <p id="settings-msg" style="margin-top:1rem;"></p>
        </form>
      </section>
    </main>
  </div>
  <script src="admin.js"></script>
</body>
</html>
